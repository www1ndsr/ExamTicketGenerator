<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Обзор генератора экзаменационных билетов</title>
  <desc id="description">Схема: ввод фамилии и имени, проверка буквами, случайная выдача билета от 1 до 20 и сохранение в Excel-журнал.</desc>
  <rect width="1200" height="360" rx="24" fill="#f5f7ff"/>
  <text x="600" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#263238">Генератор экзаменационных билетов</text>

  <rect x="42" y="105" width="238" height="150" rx="18" fill="#ffffff" stroke="#4e73df" stroke-width="3"/>
  <circle cx="161" cy="145" r="26" fill="#4e73df"/>
  <text x="161" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">1</text>
  <text x="161" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#263238">Ввод данных</text>
  <text x="161" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#546e7a">Фамилия и имя</text>

  <path d="M280 180h64" stroke="#7b8794" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="344" y="105" width="238" height="150" rx="18" fill="#ffffff" stroke="#20a464" stroke-width="3"/>
  <circle cx="463" cy="145" r="26" fill="#20a464"/>
  <text x="463" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">2</text>
  <text x="463" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#263238">Проверка</text>
  <text x="463" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#546e7a">Только буквы</text>

  <path d="M582 180h64" stroke="#7b8794" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="646" y="105" width="238" height="150" rx="18" fill="#ffffff" stroke="#f09c21" stroke-width="3"/>
  <circle cx="765" cy="145" r="26" fill="#f09c21"/>
  <text x="765" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">3</text>
  <text x="765" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#263238">Случайный билет</text>
  <text x="765" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#546e7a">Номер от 1 до 20</text>

  <path d="M884 180h64" stroke="#7b8794" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="948" y="105" width="210" height="150" rx="18" fill="#ffffff" stroke="#7a5af8" stroke-width="3"/>
  <circle cx="1053" cy="145" r="26" fill="#7a5af8"/>
  <text x="1053" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">4</text>
  <text x="1053" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#263238">Excel-журнал</text>
  <text x="1053" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#546e7a">journal.xlsx</text>

  <text x="600" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#546e7a">Esc завершает работу  •  Данные сохраняются с датой и временем</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7b8794"/>
    </marker>
  </defs>
</svg>
